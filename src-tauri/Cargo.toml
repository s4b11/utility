[package]
name = "toolbox-mobile"
version = "0.1.0"
description = "Toolbox Mobile - Native Tauri 2.0 app"
authors = ["s4b11 <s4b11@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "toolbox_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
