<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Congratulations, {{name}}!</title>
</head>
<body style="margin:0;padding:0;background:#ECF7F0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ECF7F0;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:540px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#FFFFFF;border-radius:20px;border:1px solid #D3EBDD;">
<tr><td align="center" style="padding:44px 40px 8px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="width:84px;height:84px;border-radius:42px;background:#DCF3E5;font-size:42px;line-height:84px;">&#127942;</td></tr></table>
<p style="margin:18px 0 8px;font-size:30px;font-weight:800;color:#16181D;">Congratulations, {{name}}!</p>
<p style="margin:0 0 24px;"><span style="display:inline-block;padding:8px 16px;border-radius:999px;background:#11824B;font-size:15px;font-weight:600;color:#FFFFFF;">On {{achievement}}</span></p>
</td></tr>
<tr><td style="padding:0 40px 8px;">
{{message}}
<p style="margin:8px 0 4px;font-size:15px;line-height:1.65;color:#374151;">{{#sign_off}}{{sign_off}}{{/sign_off}}{{^sign_off}}So proud of you,{{/sign_off}}</p><p style="margin:0 0 24px;font-weight:600;font-size:15px;color:#16181D;">{{sender_name}}</p>
{{#signature}}<div style="padding-top:16px;border-top:1px solid #D3EBDD;">{{signature}}</div>{{/signature}}
</td></tr>
<tr><td style="padding:8px 40px 32px;font-size:12px;color:#8A909B;">{{#sender_email}}<a href="{{sender_email_url}}" style="color:#8A909B;text-decoration:none;">{{sender_email}}</a>{{/sender_email}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
