<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Following up on {{context}}</title>
</head>
<body style="margin:0;padding:0;background:#F6F7F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F7F9;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#FFFFFF;border-radius:16px;border:1px solid #E8EAEE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<tr><td style="padding:36px 40px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="border-left:4px solid #0E7C86;padding:2px 0 2px 16px;">
<p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#0E7C86;">Follow-up</p>
<p style="margin:4px 0 0;font-size:20px;font-weight:700;line-height:1.3;color:#16181D;">Re: {{context}}</p>
</td></tr></table>
</td></tr>
<tr><td style="padding:20px 40px 8px;">
<p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:#374151;">Hi {{recipient_name}},</p>
{{body}}
{{#cta_url}}{{#cta_label}}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;"><tr><td style="border-radius:12px;background:#0E7C86;">
<a href="{{cta_url}}" style="display:inline-block;padding:13px 24px;font-size:15px;font-weight:600;color:#FFFFFF;text-decoration:none;">{{cta_label}}</a>
</td></tr></table>{{/cta_label}}{{/cta_url}}
<p style="margin:8px 0 4px;font-size:15px;line-height:1.65;color:#374151;">Best regards,</p>
<p style="margin:0 0 24px;font-size:15px;font-weight:600;color:#16181D;">{{sender_name}}</p>
{{#signature}}<div style="padding-top:16px;border-top:1px solid #E8EAEE;">{{signature}}</div>{{/signature}}
</td></tr>
<tr><td style="padding:8px 40px 32px;font-size:12px;color:#8A909B;">{{#sender_email}}<a href="{{sender_email_url}}" style="color:#8A909B;text-decoration:none;">{{sender_email}}</a>{{/sender_email}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
