<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Thank you, {{recipient_name}}</title>
</head>
<body style="margin:0;padding:0;background:#EEF6F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EEF6F6;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#FFFFFF;border-radius:24px;border:1px solid #DCEBEC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<tr><td align="center" style="padding:44px 40px 8px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="width:64px;height:64px;border-radius:32px;background:#E3F4F5;font-size:30px;line-height:64px;color:#0E7C86;">&#10084;</td></tr></table>
<h1 style="margin:22px 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.2;font-weight:700;color:#16181D;">Thank you, {{recipient_name}}</h1>
<p style="margin:0 0 24px;font-size:16px;color:#0E7C86;">for {{reason}}</p>
</td></tr>
<tr><td style="padding:0 48px 8px;text-align:center;">
{{message}}
</td></tr>
<tr><td align="center" style="padding:12px 40px 40px;">
<p style="margin:0 0 4px;font-size:15px;color:#555B66;">{{#closing}}{{closing}}{{/closing}}{{^closing}}With gratitude,{{/closing}}</p>
<p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-style:italic;color:#16181D;">{{sender_name}}</p>
{{#signature}}<div style="margin-top:20px;padding-top:16px;border-top:1px solid #E8EAEE;">{{signature}}</div>{{/signature}}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
